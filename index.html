<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2331">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'self'; form-action 'self'; object-src 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230e2331'/%3E%3Crect x='6' y='3' width='4' height='4' fill='%23e0523c'/%3E%3Crect x='6' y='7' width='4' height='4' fill='%23f6e9d8'/%3E%3C/svg%3E">
<title>Pescatore nel lago — pixel art di una giornata estiva</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="frame">
    <canvas id="game" width="960" height="540"></canvas>

    <div class="hud">
      <div class="hud-top">
        <div class="panel topbar">
          <div class="stat"><span class="label">punti</span><b id="score">0</b></div>
          <div class="stat"><span class="label">record</span><b id="best">0</b></div>
          <div class="stat"><span class="label">pescato</span><b id="caught">0</b></div>
          <div class="clock"><i id="clockbar"></i></div>
        </div>
        <div class="panel meterbar">
          <div class="meter"><span class="label">lenza</span><i class="track"><b id="tensionbar"></b></i></div>
          <div class="meter"><span class="label">distanza</span><i class="track"><b id="distbar"></b></i></div>
          <div id="msg" aria-live="polite"></div>
        </div>
      </div>

      <div class="hud-bottom">
        <div class="log" id="log"></div>
        <div class="hint">
          <span><b>tap</b>: lancio e abboccata · <b>tieni premuto</b>: recupera · <b>r</b> nuovo turno · <b>m</b> musica</span>
        </div>
      </div>
    </div>

    <div class="mb-zone">
      <div class="mb-row">
        <button id="fsZone" class="mbtn mini" type="button">schermo intero</button>
        <button id="btnRestart" class="mbtn mini" type="button">nuovo turno</button>
        <button id="btnMusic" class="mbtn mini" type="button">musica</button>
      </div>
      <div class="mb-row">
        <button id="btnCast" class="mbtn" type="button">lancia</button>
        <button id="btnHold" class="mbtn hold" type="button">tieni premuto</button>
      </div>
    </div>

    <div class="bite-cue" id="bitecue">abbocca! tap</div>
    <div class="rotate">ruota il telefono in orizzontale</div>
    <button id="fs" class="fs" type="button">schermo intero</button>
  </div>
</div>

<script src="src/palette.js"></script>
<script src="src/sprites.js"></script>
<script src="src/scene.js"></script>
<script src="src/canvas.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
<script src="src/render.js"></script>
</body>
</html>
